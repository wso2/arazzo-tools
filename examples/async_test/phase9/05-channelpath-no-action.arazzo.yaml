# Phase 9 — Scenario 5: channelPath WITHOUT action (fails on purpose). A channel has no direction, so
# the runner can't choose send vs receive → hard error at runtime (the LSP also flags this at edit time).
#
# EXPECTED: run **badFlow** → `noAction` fails immediately:
#   a 'channelPath' step requires 'action' (send or receive) - the message-flow direction is
#   otherwise undefined

arazzo: 1.1.0

info:
  title: "Phase 9 - channelPath requires action"
  version: "1.0.0"

sourceDescriptions:
  - name: orderBus
    url: ./order-events.asyncapi.yaml
    type: asyncapi

workflows:
  - workflowId: badFlow
    steps:
      - stepId: noAction
        channelPath: orderBus#/channels/orders   # no action -> runtime hard error
