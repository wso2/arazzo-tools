# Phase 11 (pre-subscription) — Scenario 4: A BROKER THAT CANNOT BE REACHED (fails on purpose).
#
# The AsyncAPI document points at a host that does not exist, so subscribing before the workflow
# starts fails. Two things matter about what happens next.
#
# FIRST — you are told immediately, before any step runs, and the message names the channel, the
# adapter and the step that needs it:
#
#   Warning: could not subscribe to channel "orders/new" via the mqtt adapter before the workflow
#   started (needed by step await): mqtt connect to tcp://nonexistent.invalid:1883 failed: ... -
#   the step will try again when it runs, and messages published in the meantime are lost
#
# SECOND — it is a WARNING, not a fatal error. Pre-subscription is an optimisation and must never be
# able to sink a workflow that would otherwise have run: a channel might sit behind a branch this run
# never takes. So the workflow proceeds, and the step that actually needs the channel retries the
# connection and fails with its own precise error. The failure belongs to the step, not to the warm-up.
#
# EXPECTED: run **unreachable** → the warning above appears first, then `await` fails:
#   receive on channel "orders/new" failed: mqtt connect to tcp://nonexistent.invalid:1883 failed: ...
#
# (Once async steps become non-blocking in Phase 14, that step failure stops failing the whole
# workflow too — it would be recorded on the step, and only a later step that `dependsOn` it would
# turn the failure into a workflow failure.)

arazzo: 1.1.0

info:
  title: "Phase 11 - pre-subscription failure warns but does not abort"
  version: "1.0.0"

sourceDescriptions:
  - name: ghostBus
    url: ./unreachable.asyncapi.yaml
    type: asyncapi

workflows:
  - workflowId: unreachable
    steps:
      - stepId: await
        channelPath: ghostBus#/channels/orders
        action: receive
        timeout: 1000
        outputs:
          seen: $message.payload.orderId
    outputs:
      seen: $steps.await.outputs.seen
