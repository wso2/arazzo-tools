# Phase 10 — Scenario 3: UNSUPPORTED content type (fails on purpose). The send declares a content
# type no serializer handles, so the runner fails LOUDLY at send instead of guessing a wire format.
#
# EXPECTED: run **badFlow** → send fails with:
#   send on channel "notify/events": no serializer registered for content type
#   "application/octet-stream" (supported: application/json, text/plain; recognized but not yet
#   implemented: application/avro, application/protobuf, application/x-protobuf, avro/binary)
#
# The message names the two lists SEPARATELY on purpose. Only JSON and text can actually encode
# anything; Protobuf and Avro are registered so those content types resolve and fail with a clear
# "needs schema config" message (see 04 and 05) rather than looking like a typo — but calling them
# "supported" would send the reader off to try one, straight into a different failure. They are
# completed alongside the real brokers that need them in Phase 11.

arazzo: 1.1.0

info:
  title: "Phase 10 - unsupported content type"
  version: "1.0.0"

sourceDescriptions:
  - name: notify
    url: ./notifications.asyncapi.yaml
    type: asyncapi

workflows:
  - workflowId: badFlow
    steps:
      - stepId: emit
        channelPath: notify#/channels/events
        action: send
        requestBody:
          contentType: application/octet-stream   # no serializer for this -> hard error
          payload:
            kind: "deploy"
