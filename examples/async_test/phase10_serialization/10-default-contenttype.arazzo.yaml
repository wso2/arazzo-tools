# Phase 10 — Scenario 10: THE DOCUMENT-LEVEL `defaultContentType`.
#
# telemetry.asyncapi.yaml sets `defaultContentType: text/plain` at its root. AsyncAPI 3.0 makes that a
# MUST for any message that declares nothing of its own — so there are two levels inside the AsyncAPI
# file before the runtime's JSON fallback is ever reached:
#
#   readings  ->  no messages block at all      ->  the DOCUMENT DEFAULT  (text/plain)
#   events    ->  message declares application/json  ->  ITS OWN declaration wins over the default
#
# Neither step below declares a contentType, and the two are serialized differently — the difference
# comes entirely from the AsyncAPI document.
#
# EXPECTED: run **defaultsFlow** → completes with
#   reading = "23.5"        (bare text from the document default)
#   kind    = "threshold"   (structured, because the message overrode the default with JSON)
#
# The two steps SELECT DIFFERENT SERIALIZERS with nothing but the AsyncAPI document to go on: the
# reading is encoded as bare text (`23.5`), the event as JSON. The exact bytes are asserted in
# TestSendFallsBackToDocumentDefaultContentType — see the note at the end of the README on why an
# example cannot show them directly.

arazzo: 1.1.0

info:
  title: "Phase 10 - document-level defaultContentType"
  version: "1.0.0"

sourceDescriptions:
  - name: telemetry
    url: ./telemetry.asyncapi.yaml
    type: asyncapi

workflows:
  - workflowId: defaultsFlow
    steps:
      # No contentType on the step, none on the channel -> the document's defaultContentType applies.
      - stepId: publishReading
        channelPath: telemetry#/channels/readings
        action: send
        requestBody:
          payload: "23.5"

      - stepId: takeReading
        channelPath: telemetry#/channels/readings
        action: receive
        timeout: 2000
        successCriteria:
          - condition: '$message.payload == "23.5"'
        outputs:
          reading: $message.payload

      # Same document, same silent step — but this channel's message overrides the default with JSON.
      - stepId: publishEvent
        channelPath: telemetry#/channels/events
        action: send
        requestBody:
          payload:
            kind: "threshold"
            value: 30

      - stepId: takeEvent
        channelPath: telemetry#/channels/events
        action: receive
        timeout: 2000
        successCriteria:
          - condition: '$message.payload.kind == "threshold"'
        outputs:
          kind: $message.payload.kind
    outputs:
      reading: $steps.takeReading.outputs.reading
      kind: $steps.takeEvent.outputs.kind
